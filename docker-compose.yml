# Боевой запуск wtbot на Linux: `docker compose up -d --build`.
# Перед первым запуском: .env по образцу .env.example (TOKEN, WT_COOKIE,
# WEB_TOKEN обязателен), база и assets — в ./data (см. README, «Docker»).
services:
  wtbot:
    build: .
    image: wtbot:latest
    init: true
    # Стабильное имя хоста: Chromium хранит его в SingletonLock профиля.
    hostname: wtbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      # Пути и сеть контейнера важнее значений из .env, записанных для Windows.
      PORT: "3000"
      WEB_HOST: 0.0.0.0
      DB_PATH: /app/data/wtbot.db
      WT_BROWSER_PROFILE_DIR: /app/data/wt-browser-profile
      WT_BROWSER_EXECUTABLE: /usr/bin/chromium
      WT_BROWSER_NO_SANDBOX: "true"
      # The War Thunder client, mounted read-only below: tactical maps, nation
      # flags and the clan-tag font are read from its files.
      WT_GAME_DIR: /opt/war-thunder
      TZ: ${TZ:-UTC}
    ports:
      # Только на loopback хоста. Для доступа из сети поставьте перед ботом
      # reverse proxy с TLS (и WEB_TRUST_PROXY) или замените на "3000:3000".
      - "127.0.0.1:3000:3000"
      # VNC к виртуальному дисплею браузера (нужен WT_VNC_PASSWORD в .env):
      - "127.0.0.1:5900:5900"
    volumes:
      - ./data:/app/data
      # ./data/wt-game: copies of the game files the bot reads, at the game's
      # paths (TACTICAL_MAP_SOURCES in src/tactical-map/game-files.ts, plus the
      # optional HQ textures of TACTICAL_MAP_OPTIONAL_SOURCES; ui/ alone gives
      # flags and fonts, maps then fall back to wt-tools snapshots).
      # Or WT_GAME_HOST_DIR in .env: the game folder itself (Steam:
      # ~/.local/share/Steam/steamapps/common/War Thunder), following patches.
      - ${WT_GAME_HOST_DIR:-./data/wt-game}:/opt/war-thunder:ro
    # Shutdown: до 10 с на producers, затем Edge, Discord, worker pool и SQLite.
    stop_grace_period: 45s

  backup:
    image: wtbot:latest
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - wtbot
    env_file: .env
    environment:
      DB_PATH: /app/data/wtbot.db
      WT_BROWSER_ENABLED: "false"
      WTBOT_BACKUP_DIR: /backups
      WTBOT_BACKUP_TIME: ${WTBOT_BACKUP_TIME:-04:30}
      WTBOT_BACKUP_KEEP: ${WTBOT_BACKUP_KEEP:-3}
      TZ: ${TZ:-UTC}
    command: ["node", "dist/analysis/db-backup-schedule.js"]
    healthcheck:
      disable: true
    volumes:
      - ./data:/app/data
      # Держите копии на другом диске хоста, если он есть.
      - ./backups:/backups
    stop_grace_period: 10m

  # Offsite backup (offsite/offsite.sh): encrypted restic snapshots of this project on Google Drive,
  # nightly. On with COMPOSE_PROFILES=offsite in .env; settings in .env.offsite (offsite/env.example).
  offsite:
    build: ./offsite
    image: wtbot-offsite:latest
    profiles: [offsite]
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env.offsite
        required: false
    environment:
      OFFSITE_NAME: wtbot
      # A restore makes the newest nightly copy (the backup service above) the live database.
      OFFSITE_DB: data/wtbot.db
      OFFSITE_DB_COPIES: backups/wtbot-*.db
    volumes:
      - .:/project:ro
      - offsite-state:/state
    healthcheck:
      test: ["CMD", "/usr/local/bin/offsite", "health"]
      interval: 15m
      start_period: 12h
    stop_grace_period: 1m

volumes:
  offsite-state:
