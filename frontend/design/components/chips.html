<!-- @dsCard group="Components" name="Чипы и бейджи" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #111015; color: #f2efe6; font: 13px 'Segoe UI', system-ui, sans-serif; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d7885; margin: 14px 0 8px; }
  h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: #18161b; border: 1px solid #2d2b33; color: #b8b3ac; white-space: nowrap; }
  .chip.ok { color: #8ee6a1; border-color: rgba(142,230,161,.3); background: rgba(142,230,161,.14); }
  .chip.fail { color: #ff8fa3; border-color: rgba(255,143,163,.3); background: rgba(255,143,163,.14); }
  .chip.accent { color: #f5bc4a; border-color: rgba(245,188,74,.35); background: rgba(245,188,74,.16); font-weight: 700; }
  .result-badge { display: inline-block; text-align: center; font-weight: 700; border-radius: 6px; padding: 3px 9px; font-size: 11px; }
  .result-badge.win { color: #8ee6a1; background: rgba(142,230,161,.14); }
  .result-badge.loss { color: #ff8fa3; background: rgba(255,143,163,.14); }
  .result-badge.unknown { color: #b8b3ac; background: rgba(184,179,172,.1); }
  .delta-pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta-pill.up { background: rgba(142,230,161,.12); color: #8ee6a1; }
  .delta-pill.down { background: rgba(255,143,163,.12); color: #ff8fa3; }
  .rank-badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: #1e1c23; border: 1px solid #4a4655; font-size: 12px; font-weight: 700; color: #b8b3ac; }
  .rank-badge.gold { background: linear-gradient(135deg, rgba(245,188,74,.35), rgba(245,188,74,.1)); border-color: rgba(245,188,74,.4); color: #f5bc4a; }
  .avatar-tile { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg,#ffd873,#e89b1f); font-weight: 800; color: #111015; font-size: 15px; box-shadow: 0 10px 30px -8px rgba(245,188,74,.5); }
</style>
</head>
<body>
  <h3>Чипы — метаданные и навигация</h3>
  <div class="row">
    <span class="chip">ID 12345678</span>
    <span class="chip">обновлено сегодня, 19:11</span>
    <span class="chip accent">AURI · Aurora Imperialis</span>
    <span class="chip ok">данные получены</span>
    <span class="chip fail">лимит источника</span>
  </div>
  <h3>Бейджи исхода</h3>
  <div class="row">
    <span class="result-badge win">Победа</span>
    <span class="result-badge loss">Поражение</span>
    <span class="result-badge unknown">?</span>
  </div>
  <h3>Дельты-пилюли</h3>
  <div class="row">
    <span>1 808 <span class="delta-pill down">−14</span></span>
    <span>1 481 <span class="delta-pill up">+26</span></span>
  </div>
  <h3>Ранги и аватары</h3>
  <div class="row">
    <span class="rank-badge gold">1</span>
    <span class="rank-badge">2</span>
    <span class="rank-badge">3</span>
    <span class="avatar-tile">AU</span>
    <span class="avatar-tile" style="border-radius:14px; width:58px; height:58px; font-size:22px">V</span>
  </div>
</body>
</html>
