<!-- @dsCard group="Components" name="Кнопки, поля и переключатели" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #111015; color: #f2efe6; font: 13px 'Segoe UI', system-ui, sans-serif; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d7885; margin: 16px 0 8px; }
  h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { background: #18161b; border: 1px solid #4a4655; color: #f2efe6; border-radius: 10px; padding: 9px 18px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #1e1c23; }
  .btn.gold { border: none; background: linear-gradient(135deg,#ffdf8a,#f0a72e); color: #231a06; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 16px 32px -16px rgba(245,188,74,.55); padding: 10px 22px; }
  .btn.gold:hover { filter: brightness(1.1); }
  .seg-control { display: inline-flex; gap: 4px; background: #111015; border: 1px solid #2d2b33; border-radius: 9px; padding: 3px; }
  .seg-control button { border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 7px; background: transparent; color: #b8b3ac; }
  .seg-control button.active { background: #f5bc4a; color: #111015; }
  .input { background: #18161b; border: 1px solid #4a4655; color: #f2efe6; border-radius: 10px; padding: 9px 12px; font: inherit; min-width: 240px; }
  .hero-form { display: flex; gap: 8px; padding: 8px; border-radius: 16px; background: #18161b; border: 1px solid #4a4655; max-width: 480px; box-shadow: 0 34px 80px -30px rgba(0,0,0,.9), 0 0 80px -20px rgba(245,188,74,.3), 0 0 0 1px rgba(245,188,74,.14); }
  .hero-form input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #f2efe6; font-size: 16px; font-family: inherit; padding-left: 8px; }
  .notice { padding: 10px 14px; border-radius: 10px; background: #18161b; border: 1px solid #2d2b33; font-size: 13px; max-width: 480px; }
  .notice.fail { color: #ff8fa3; border-color: rgba(255,143,163,.3); }
  input[type='range'] { accent-color: #f5bc4a; width: 320px; }
</style>
</head>
<body>
  <h3>Кнопки</h3>
  <div class="row">
    <button class="btn gold">▶ Играть</button>
    <button class="btn gold">Найти</button>
    <button class="btn">Обычная</button>
  </div>
  <h3>Сегментированные переключатели</h3>
  <div class="row">
    <span class="seg-control"><button>1×</button><button class="active">4×</button><button>16×</button></span>
    <span class="seg-control"><button>7 дн.</button><button class="active">30 дн.</button><button>90 дн.</button></span>
    <span class="seg-control"><button class="active">Все</button><button>Победы</button><button>Поражения</button></span>
  </div>
  <h3>Hero-поиск со свечением</h3>
  <div class="hero-form">
    <input placeholder="Ник игрока или WT user id…">
    <button class="btn gold">Найти</button>
  </div>
  <h3>Таймлайн плеера</h3>
  <input type="range" min="0" max="900" value="340">
  <h3>Уведомления</h3>
  <div class="notice">Аккаунт и WRPL-статистика не сравниваются напрямую.</div>
  <div style="height:8px"></div>
  <div class="notice fail">Игрок не найден в локальных данных.</div>
</body>
</html>
